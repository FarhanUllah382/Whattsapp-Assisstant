# Prometheus + Grafana for Ahmed's WhatsApp Assistant. See docs/OBSERVABILITY.md.
#
#   npm run obs:up     # start (from the repo root)
#   npm run obs:down   # stop; named volumes (history, dashboards state) are kept
#
# This stack never includes or touches the WAHA container or its session volume.
# Both secrets live in the gitignored folder observability/secrets/:
#   secrets/ops_key                  same value as OPERATIONS_API_KEY in .env
#   secrets/grafana_admin_password   Grafana "admin" password (your choice)
# Ports are bound to 127.0.0.1 only: http://localhost:9090 and http://localhost:3002

name: ahmed-observability

services:
  prometheus:
    image: prom/prometheus:v2.53.2
    container_name: ahmed-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./secrets/ops_key:/etc/prometheus/secrets/ops_key:ro
      - ahmed_prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ahmed-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3002:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      GF_SECURITY_ADMIN_USER: admin
      # Read from the secret file; the password is never written in this repo.
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/ahmed-assistant-live.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - ./secrets/ops_key:/run/secrets/ops_key:ro
      - ./secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - ahmed_grafana_data:/var/lib/grafana

volumes:
  ahmed_prometheus_data:
  ahmed_grafana_data:
