<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1350" width="1700" height="1350" style="background:#090d13;font-family:Consolas,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#bc8cff"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- TITLE HEADER -->
  <rect x="30" y="25" width="1640" height="75" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="65" fill="#58a6ff" font-size="24" font-weight="bold">AHMED'S WHATSAPP ASSISTANT — COMPLETE DATABASE ARCHITECTURE</text>
  <text x="60" y="87" fill="#8b949e" font-size="13">SQLite (ahmed.db) · 20 Entities · Production Exact-Money Schema · Full Security Hardening</text>
  <rect x="1460" y="47" width="180" height="30" rx="6" fill="#238636"/>
  <text x="1550" y="67" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">ACTIVE PRODUCTION</text>

  <!-- CONNECTOR PATHS -->
  <!-- Customers -> Orders -->
  <path d="M 330 260 L 450 260 L 450 260 L 520 260" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Customers -> Order Drafts -->
  <path d="M 330 320 L 410 320 L 410 470 L 520 470" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Order Drafts -> Orders -->
  <path d="M 670 420 L 670 370" fill="none" stroke="#bc8cff" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-purple)"/>
  <!-- Orders -> Order Status Events -->
  <path d="M 820 250 L 920 250" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Customers -> Order Lookup Attempts -->
  <path d="M 330 230 L 430 230 L 430 150 L 520 150" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Customers -> Ledger -->
  <path d="M 210 420 L 210 650 L 520 650" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
  <!-- Orders -> Ledger -->
  <path d="M 640 370 L 640 600" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
  <!-- Customers -> Payment Claims -->
  <path d="M 190 420 L 190 850 L 520 850" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Orders -> Payment Claims -->
  <path d="M 740 370 L 740 780" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Customers -> Messages -->
  <path d="M 90 280 L 40 280 L 40 1020 L 100 1020" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Customers -> Checkpoints -->
  <path d="M 210 420 L 210 1000" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Customers -> Customer Notes -->
  <path d="M 330 380 L 420 380 L 420 1030 L 490 1030" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Customers -> Customer Consent -->
  <path d="M 210 140 L 210 110 L 980 110 L 980 140" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Customers -> Send Ledger -->
  <path d="M 270 420 L 270 1200 L 920 1200" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Owner Alerts -> Owner Alert Events -->
  <path d="M 1220 860 L 1320 860" fill="none" stroke="#bc8cff" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- ==================== TABLES ==================== -->

  <!-- 1. CUSTOMERS -->
  <g filter="url(#shadow)">
    <rect x="90" y="140" width="240" height="280" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <rect x="90" y="140" width="240" height="38" rx="8" fill="#1f6feb"/>
    <text x="210" y="165" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">customers</text>
    <text x="105" y="200" fill="#3fb950" font-size="12" font-weight="bold">PK id</text><text x="250" y="200" fill="#8b949e" font-size="12">INTEGER</text>
    <text x="105" y="225" fill="#bc8cff" font-size="12" font-weight="bold">UK phone</text><text x="250" y="225" fill="#8b949e" font-size="12">TEXT</text>
    <text x="105" y="250" fill="#e6edf3" font-size="12">name</text><text x="250" y="250" fill="#8b949e" font-size="12">TEXT</text>
    <text x="105" y="275" fill="#e6edf3" font-size="12">disclosure_sent_at</text><text x="250" y="275" fill="#8b949e" font-size="12">TEXT</text>
    <text x="105" y="300" fill="#e6edf3" font-size="12">automation_opted_out</text><text x="270" y="300" fill="#8b949e" font-size="12">INT</text>
    <text x="105" y="325" fill="#e6edf3" font-size="12">opted_out_at</text><text x="250" y="325" fill="#8b949e" font-size="12">TEXT</text>
    <text x="105" y="350" fill="#e6edf3" font-size="12">opted_in_at</text><text x="250" y="350" fill="#8b949e" font-size="12">TEXT</text>
    <text x="105" y="375" fill="#e6edf3" font-size="12">created_at</text><text x="250" y="375" fill="#8b949e" font-size="12">TEXT</text>
    <rect x="105" y="392" width="210" height="20" rx="4" fill="#21262d"/>
    <text x="210" y="406" fill="#58a6ff" font-size="10" text-anchor="middle">🔒 Central Identity &amp; Auth Seam</text>
  </g>

  <!-- 2. ORDERS -->
  <g filter="url(#shadow)">
    <rect x="520" y="140" width="300" height="230" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <rect x="520" y="140" width="300" height="38" rx="8" fill="#1f6feb"/>
    <text x="670" y="165" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">orders</text>
    <text x="535" y="198" fill="#3fb950" font-size="12" font-weight="bold">PK id</text><text x="730" y="198" fill="#8b949e" font-size="12">INTEGER</text>
    <text x="535" y="220" fill="#bc8cff" font-size="12" font-weight="bold">UK public_ref (80-bit)</text><text x="730" y="220" fill="#8b949e" font-size="12">TEXT</text>
    <text x="535" y="242" fill="#58a6ff" font-size="12" font-weight="bold">FK customer_id</text><text x="730" y="242" fill="#8b949e" font-size="12">INTEGER</text>
    <text x="535" y="264" fill="#e6edf3" font-size="12">items_json</text><text x="730" y="264" fill="#8b949e" font-size="12">JSON</text>
    <text x="535" y="286" fill="#e6edf3" font-size="12">total_minor (Paisas)</text><text x="730" y="286" fill="#8b949e" font-size="12">INTEGER</text>
    <text x="535" y="308" fill="#e6edf3" font-size="12">delivery_address, city</text><text x="730" y="308" fill="#8b949e" font-size="12">TEXT</text>
    <text x="535" y="330" fill="#e6edf3" font-size="12">status (Retail machine)</text><text x="730" y="330" fill="#8b949e" font-size="12">TEXT</text>
    <rect x="535" y="342" width="270" height="20" rx="4" fill="#21262d"/>
    <text x="670" y="356" fill="#3fb950" font-size="10" text-anchor="middle">🛡️ Anti-IDOR: Public Ref Masking</text>
  </g>

  <!-- 3. ORDER DRAFTS -->
  <g filter="url(#shadow)">
    <rect x="520" y="420" width="300" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="520" y="420" width="300" height="34" rx="8" fill="#21262d"/>
    <text x="670" y="443" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">order_drafts</text>
    <text x="535" y="475" fill="#3fb950" font-size="11">PK id</text>
    <text x="535" y="495" fill="#58a6ff" font-size="11">FK customer_id (Partial UK: 1 awaiting)</text>
    <text x="535" y="515" fill="#bc8cff" font-size="11">FK order_id -> orders.id</text>
    <text x="535" y="535" fill="#e6edf3" font-size="11">items_json, total_minor, status</text>
    <rect x="535" y="545" width="270" height="18" rx="3" fill="#161b22"/>
    <text x="670" y="558" fill="#d29922" font-size="10" text-anchor="middle">Two-Phase Fulfillment Guard</text>
  </g>

  <!-- 4. ORDER STATUS EVENTS -->
  <g filter="url(#shadow)">
    <rect x="920" y="180" width="280" height="140" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="920" y="180" width="280" height="34" rx="8" fill="#21262d"/>
    <text x="1060" y="203" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">order_status_events</text>
    <text x="935" y="235" fill="#3fb950" font-size="11">PK id</text>
    <text x="935" y="255" fill="#58a6ff" font-size="11">FK order_id -> orders.id</text>
    <text x="935" y="275" fill="#58a6ff" font-size="11">FK actor_customer_id -> customers.id</text>
    <text x="935" y="295" fill="#e6edf3" font-size="11">from_status -> to_status, evidence</text>
  </g>

  <!-- 5. PRODUCTS -->
  <g filter="url(#shadow)">
    <rect x="1300" y="140" width="280" height="230" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <rect x="1300" y="140" width="280" height="38" rx="8" fill="#238636"/>
    <text x="1440" y="165" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">products</text>
    <text x="1315" y="198" fill="#3fb950" font-size="12" font-weight="bold">PK id</text><text x="1490" y="198" fill="#8b949e" font-size="12">INTEGER</text>
    <text x="1315" y="220" fill="#bc8cff" font-size="12" font-weight="bold">UK sku</text><text x="1490" y="220" fill="#8b949e" font-size="12">TEXT (2-64)</text>
    <text x="1315" y="242" fill="#e6edf3" font-size="12">name, category</text><text x="1490" y="242" fill="#8b949e" font-size="12">TEXT</text>
    <text x="1315" y="264" fill="#e6edf3" font-size="12">size, color</text><text x="1490" y="264" fill="#8b949e" font-size="12">TEXT</text>
    <text x="1315" y="286" fill="#e6edf3" font-size="12">price_minor (Paisas)</text><text x="1490" y="286" fill="#8b949e" font-size="12">INTEGER</text>
    <text x="1315" y="308" fill="#e6edf3" font-size="12">stock (Non-negative)</text><text x="1490" y="308" fill="#8b949e" font-size="12">INTEGER</text>
    <text x="1315" y="330" fill="#e6edf3" font-size="12">active, aliases_json</text><text x="1490" y="330" fill="#8b949e" font-size="12">INT/JSON</text>
    <rect x="1315" y="342" width="250" height="20" rx="4" fill="#21262d"/>
    <text x="1440" y="356" fill="#3fb950" font-size="10" text-anchor="middle">🛡️ Triggers: Abort stock &lt; 0</text>
  </g>

  <!-- 6. LEDGER -->
  <g filter="url(#shadow)">
    <rect x="520" y="600" width="300" height="150" rx="8" fill="#161b22" stroke="#238636" stroke-width="2"/>
    <rect x="520" y="600" width="300" height="34" rx="8" fill="#238636"/>
    <text x="670" y="623" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">ledger (Double-Entry)</text>
    <text x="535" y="655" fill="#3fb950" font-size="11">PK id</text>
    <text x="535" y="675" fill="#58a6ff" font-size="11">FK customer_id -> customers.id</text>
    <text x="535" y="695" fill="#58a6ff" font-size="11">FK order_id -> orders.id (nullable)</text>
    <text x="535" y="715" fill="#e6edf3" font-size="11">kind: 'debit' | 'credit'</text>
    <text x="535" y="735" fill="#e6edf3" font-size="11">amount_minor: Pakistani paisas (>= 0)</text>
  </g>

  <!-- 7. PAYMENT CLAIMS -->
  <g filter="url(#shadow)">
    <rect x="520" y="780" width="300" height="150" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <rect x="520" y="780" width="300" height="34" rx="8" fill="#21262d"/>
    <text x="670" y="803" fill="#d29922" font-size="13" font-weight="bold" text-anchor="middle">payment_claims</text>
    <text x="535" y="835" fill="#3fb950" font-size="11">PK id</text>
    <text x="535" y="855" fill="#58a6ff" font-size="11">FK customer_id, FK order_id</text>
    <text x="535" y="875" fill="#e6edf3" font-size="11">amount_minor, method, reference</text>
    <text x="535" y="895" fill="#e6edf3" font-size="11">status: 'pending' | 'approved' | 'rejected'</text>
    <text x="535" y="915" fill="#58a6ff" font-size="11">FK resolved_by_customer_id</text>
  </g>

  <!-- 8. ORDER LOOKUP ATTEMPTS -->
  <g filter="url(#shadow)">
    <rect x="520" y="20" width="300" height="100" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <rect x="520" y="20" width="300" height="30" rx="8" fill="#21262d"/>
    <text x="670" y="41" fill="#f85149" font-size="12" font-weight="bold" text-anchor="middle">order_lookup_attempts</text>
    <text x="535" y="70" fill="#3fb950" font-size="11">PK id, FK customer_id</text>
    <text x="535" y="90" fill="#e6edf3" font-size="11">reference_hash (SHA-256), outcome</text>
    <text x="535" y="108" fill="#8b949e" font-size="10">🛡️ Rate-Limiter: 10 fails / 15m window</text>
  </g>

  <!-- 9. CONVERSATION & AI MEMORY -->
  <!-- messages -->
  <g filter="url(#shadow)">
    <rect x="90" y="960" width="160" height="110" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="90" y="960" width="160" height="28" rx="8" fill="#21262d"/>
    <text x="170" y="979" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">messages</text>
    <text x="100" y="1005" fill="#3fb950" font-size="10">PK id</text>
    <text x="100" y="1025" fill="#58a6ff" font-size="10">FK customer_id</text>
    <text x="100" y="1045" fill="#e6edf3" font-size="10">direction, body</text>
  </g>

  <!-- checkpoints -->
  <g filter="url(#shadow)">
    <rect x="270" y="960" width="190" height="110" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="270" y="960" width="190" height="28" rx="8" fill="#21262d"/>
    <text x="365" y="979" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">checkpoints</text>
    <text x="280" y="1005" fill="#3fb950" font-size="10">PK/FK customer_id</text>
    <text x="280" y="1025" fill="#e6edf3" font-size="10">summary (PII-Scrubbed)</text>
    <text x="280" y="1050" fill="#8b949e" font-size="9">Rolling turn context</text>
  </g>

  <!-- customer_notes -->
  <g filter="url(#shadow)">
    <rect x="480" y="960" width="220" height="110" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="480" y="960" width="220" height="28" rx="8" fill="#21262d"/>
    <text x="590" y="979" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">customer_notes</text>
    <text x="490" y="1005" fill="#3fb950" font-size="10">PK id, FK customer_id</text>
    <text x="490" y="1025" fill="#e6edf3" font-size="10">headline, body (Sanitized)</text>
    <text x="490" y="1045" fill="#bc8cff" font-size="10">FK superseded_by</text>
  </g>

  <!-- 10. REPLAY & IDEMPOTENCY -->
  <g filter="url(#shadow)">
    <rect x="920" y="960" width="310" height="260" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="920" y="960" width="310" height="34" rx="8" fill="#21262d"/>
    <text x="1075" y="983" fill="#58a6ff" font-size="13" font-weight="bold" text-anchor="middle">Idempotency &amp; Replay Guards</text>

    <text x="935" y="1020" fill="#58a6ff" font-size="11" font-weight="bold">inbound_guard_state</text>
    <text x="945" y="1038" fill="#8b949e" font-size="10">PK id (check id=1), accept_after</text>

    <text x="935" y="1070" fill="#58a6ff" font-size="11" font-weight="bold">inbound_events</text>
    <text x="945" y="1088" fill="#8b949e" font-size="10">PK event_key, UK (channel, msg_id), status</text>

    <text x="935" y="1120" fill="#58a6ff" font-size="11" font-weight="bold">send_ledger</text>
    <text x="945" y="1138" fill="#8b949e" font-size="10">PK hash(cid, in, out), FK customer_id</text>

    <text x="935" y="1170" fill="#58a6ff" font-size="11" font-weight="bold">bookkeeping_receipts</text>
    <text x="945" y="1188" fill="#8b949e" font-size="10">PK id, FK customer_id, effect, result_json</text>
  </g>

  <!-- 11. OWNER ALERTS -->
  <g filter="url(#shadow)">
    <rect x="920" y="750" width="300" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="920" y="750" width="300" height="34" rx="8" fill="#21262d"/>
    <text x="1070" y="773" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">owner_alerts</text>
    <text x="935" y="805" fill="#3fb950" font-size="11">PK id</text>
    <text x="935" y="825" fill="#bc8cff" font-size="11">kind [Partial UK: 1 pending per kind]</text>
    <text x="935" y="845" fill="#58a6ff" font-size="11">FK first/latest_customer_id</text>
    <text x="935" y="865" fill="#e6edf3" font-size="11">occurrence_count, status</text>
  </g>

  <!-- owner_alert_events -->
  <g filter="url(#shadow)">
    <rect x="1320" y="780" width="240" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="1320" y="780" width="240" height="28" rx="8" fill="#21262d"/>
    <text x="1440" y="800" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">owner_alert_events</text>
    <text x="1335" y="825" fill="#3fb950" font-size="10">PK event_key</text>
    <text x="1335" y="845" fill="#58a6ff" font-size="10">FK alert_id -> owner_alerts.id</text>
  </g>

  <!-- 12. CONSENT & PRIVACY MIGRATIONS -->
  <g filter="url(#shadow)">
    <rect x="920" y="20" width="300" height="120" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="920" y="20" width="300" height="30" rx="8" fill="#21262d"/>
    <text x="1070" y="41" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">customer_consent_events</text>
    <text x="935" y="70" fill="#3fb950" font-size="11">PK id, FK customer_id</text>
    <text x="935" y="90" fill="#bc8cff" font-size="11">UK event_key, action: opt_out/in</text>
    <text x="935" y="110" fill="#e6edf3" font-size="11">confirmation_status: pending|sent</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1300" y="960" width="280" height="110" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="1300" y="960" width="280" height="30" rx="8" fill="#21262d"/>
    <text x="1440" y="981" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">privacy_migrations</text>
    <text x="1315" y="1010" fill="#3fb950" font-size="10">PK migration_key</text>
    <text x="1315" y="1030" fill="#e6edf3" font-size="10">checkpoint_rows_redacted</text>
    <text x="1315" y="1050" fill="#e6edf3" font-size="10">note_rows_redacted, applied_at</text>
  </g>

  <!-- LEGEND -->
  <rect x="30" y="1260" width="1640" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="1295" fill="#8b949e" font-size="13" font-weight="bold">DIAGRAM LEGEND:</text>
  <rect x="200" y="1282" width="16" height="16" rx="3" fill="#1f6feb"/><text x="225" y="1295" fill="#e6edf3" font-size="12">Primary Entity</text>
  <rect x="370" y="1282" width="16" height="16" rx="3" fill="#238636"/><text x="395" y="1295" fill="#e6edf3" font-size="12">Financial / Stock Gate</text>
  <rect x="580" y="1282" width="16" height="16" rx="3" fill="#d29922"/><text x="605" y="1295" fill="#e6edf3" font-size="12">Owner Review Gate</text>
  <rect x="780" y="1282" width="16" height="16" rx="3" fill="#f85149"/><text x="805" y="1295" fill="#e6edf3" font-size="12">Rate Limiter / Security</text>
  <line x1="990" y1="1290" x2="1030" y2="1290" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/><text x="1040" y="1295" fill="#e6edf3" font-size="12">Foreign Key (1:M)</text>
  <line x1="1200" y1="1290" x2="1240" y2="1290" stroke="#bc8cff" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-purple)"/><text x="1250" y="1295" fill="#e6edf3" font-size="12">Lifecycle Promotion</text>
</svg>
